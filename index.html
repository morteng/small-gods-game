<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Gods</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a1a2e'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23ffd27f'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #app { width: 100%; height: 100%; }
    /* Boot veil: a CONTENTFUL dark cover painted before any JS runs. Without
       content Chrome defers the document's first paint entirely (measured:
       first-paint only fired when the first WebGPU frame presented, ~6.7s in
       dev) and the compositor shows its bright fallback — the white flash.
       The dim wordmark is what makes this count as contentful paint.
       main.ts fades it out (snappy) once the first shell frame has presented. */
    #boot-veil {
      position: fixed; inset: 0; z-index: 10; background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      opacity: 1; transition: opacity 180ms ease-out; pointer-events: none;
    }
    #boot-veil span {
      color: #2e2e4a; font: 700 14px ui-monospace, monospace; letter-spacing: 0.5em;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-veil"><span>SMALL GODS</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
